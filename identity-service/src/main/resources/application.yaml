spring:
  application:
    name: identity-service
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

everypicfound:
  auth:
    password:
      bcrypt-strength: ${EPF_BCRYPT_STRENGTH:14}
    jwt:
      issuer: ${EPF_JWT_ISSUER:everypicfound-identity}
      audience: ${EPF_JWT_AUDIENCE:everypicfound-api}
      access-token-ttl: ${EPF_JWT_ACCESS_TOKEN_TTL:30m}
      clock-skew: ${EPF_JWT_CLOCK_SKEW:30s}
      private-key-location: ${EPF_JWT_PRIVATE_KEY_LOCATION:file:./config/keys/identity-private.pem}
      public-key-location: ${EPF_JWT_PUBLIC_KEY_LOCATION:file:./config/keys/identity-public.pem}
