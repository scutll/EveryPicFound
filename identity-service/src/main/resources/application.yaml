spring:
  application:
    name: identity-service
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

everypicfound:
  auth:
    password:
      bcrypt-strength: ${EPF_BCRYPT_STRENGTH:14}
